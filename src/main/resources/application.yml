server:
  port: 8081

spring:
  application:
    name: kafka-producer
  kafka:
    # Hostnames resolve to the static lab IPs (Windows hosts file)
    bootstrap-servers: kafka-1:9092,kafka-2:9092,kafka-3:9092
    # Applies to producer and admin clients alike. Account cbar-producer may write to (and create)
    # any topic - see the broker ACLs. Lab only: the password is kept here in plain text.
    security:
      protocol: SASL_PLAINTEXT
    properties:
      sasl.mechanism: SCRAM-SHA-512
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="cbar-producer" password="zzCAiJdarfjrTeswTKbiBP6h";
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Wait for all in-sync replicas; with min.insync.replicas=2 a write survives one broker loss
      acks: all
      properties:
        # No duplicates on retry, per-partition order kept
        enable.idempotence: true
        # Total time for a send incl. retries; after that the send fails and the caller must react
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        # How long send() may block waiting for metadata (e.g. first broker in the list is down)
        max.block.ms: 10000
    admin:
      # Fail startup if the topic cannot be created/verified instead of running half-configured
      fail-fast: true

management:
  endpoints:
    web:
      exposure:
        # Scraped by Prometheus (infra/monitoring in cbar-integration-hub)
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

app:
  kafka:
    topic:
      name: cbar.messages
      partitions: 3
      replicas: 3
      min-insync-replicas: 2
    send-timeout: 15s
